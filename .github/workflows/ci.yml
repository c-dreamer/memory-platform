name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    # No services: block. GitHub-hosted macOS/Windows runners have no Docker
    # daemon, and the two DB-gated tests in tests/integration.rs are #[ignore]
    # and never run here (see the `--include-ignored` note in that file) - so
    # this container was never actually exercised by this workflow.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Secret scan
        shell: bash
        run: ./scripts/check_secrets.sh

      - name: Build (all targets)
        run: cargo build --all-targets --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Format check
        run: cargo fmt --check
